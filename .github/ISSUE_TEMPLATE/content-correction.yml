name: Content correction
description: Report a factual, mathematical, code, translation, or explanation error.
title: "[Correction] "
labels:
  - content
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进 Awesome-AI。请尽量给出知识点编号和可核查依据；不要只粘贴模型生成的结论。

  - type: input
    id: unit
    attributes:
      label: 知识点编号
      description: 例如 A09、F07、R05；若问题位于导航页，请填写文件路径。
      placeholder: F07
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 文件与位置
      description: 请填写文件路径、标题或行号。
      placeholder: docs/02-perception-language/f-nlp-transformers-llms.md，F07 的公式/机制
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 事实或定义错误
        - 数学或公式错误
        - 代码错误
        - 资料引用不支持正文
        - 表述、翻译或排版问题
        - 其他内容问题
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 当前内容与问题
      description: 请准确说明哪里不正确，以及它为什么会误导读者。
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: 建议修正
      description: 给出建议文本、公式、代码或最小复现（如适用）。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 可核查依据
      description: 优先提供教材、论文、课程讲义、标准或官方文档的永久链接与精确章节。
      placeholder: 资料标题、章节/页码、URL
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认这不是重复报告。
          required: true
        - label: 我已区分可验证事实、个人建议与尚未验证的推断。
          required: true

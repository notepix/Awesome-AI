[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-labs"
version = "0.1.0"
description = "Offline-first, from-scratch AI teaching laboratories"
requires-python = ">=3.10,<3.15"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "scikit-learn>=1.3,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
local-model = ["transformers>=4.45,<5", "safetensors>=0.4"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["labs*"]

[tool.pytest.ini_options]
testpaths = ["labs/tests"]
